name: Morning Report

on:
  push:
    branches: [ "main", "feature/sales-logger" ]
  pull_request:
    branches: [ "main" ]

jobs:
  run-logger:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install gspread google-auth python-dotenv

    - name: Run Sales Logger
      env:
        GOOGLE_SHEETS_ID: ${{ secrets.GOOGLE_SHEETS_ID }}
      run: |
        echo "${{ secrets.GOOGLE_SERVICE_ACCOUNT }}" > service-account.json
        python sales_logger.py 'ชาไทย:1:55'