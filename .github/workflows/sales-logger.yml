name: Daily Sales Logger

on:
  push:
    branches: [ "main", "feature/sales-logger" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:  # เพิ่มบรรทัดนี้ เพื่อให้กดปุ่มสั่งรันบนหน้าเว็บ GitHub ได้
  schedule:
    - cron: '0 13 * * *'  # เพิ่มบรรทัดนี้ ตั้งเวลารันอัตโนมัติ 13:00 UTC (ตรงกับ 20:00 น. เวลาไทย)

jobs:
  run-logger:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install dependencies
      # เพิ่ม requests เข้าไปสำหรับใช้ยิง API ส่งข้อความเข้า Bot
      run: |
        python -m pip install --upgrade pip
        pip install gspread google-auth python-dotenv requests streamlit

    - name: Run Sales Logger
      env:
        GOOGLE_SHEETS_ID: ${{ secrets.GOOGLE_SHEETS_ID }}
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        # ย้ายการเรียก Secret ของ Service Account มาไว้ใน env
        GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_SERVICE_ACCOUNT }}
      run: |
        # เรียกใช้ตัวแปรจาก env โดยตรง ป้องกันปัญหาเครื่องหมายคำพูดตีกัน
        echo "$GOOGLE_CREDENTIALS" > service-account.json
        python sales_logger.py --menu "ชาไทย" --qty 1 --price 55